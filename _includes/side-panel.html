<header class="site-header">
  <nav class="site-nav" aria-label="主导航">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
      <span class="site-brand__mark">Z</span>
      <span>{{ site.title }}</span>
    </a>

    <div class="site-nav__links">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/#blog' | relative_url }}">文章</a>
      {% for item in site.nav %}
        <a href="{{ item.url }}">{{ item.title }}</a>
      {% endfor %}
    </div>
  </nav>

  <section class="hero" aria-label="博客介绍">
    <div class="hero__media" aria-hidden="true">
      <img src="{{ '/assets/images/background-cover.jpg' | relative_url }}" alt="">
    </div>

    <div class="hero__content">
      <p class="eyebrow">Personal Blog</p>
      <h1>{{ site.title }}</h1>
      {% if site.subtitle %}
        <p class="hero__subtitle">{{ site.subtitle }}</p>
      {% endif %}
      <p class="hero__description">{{ site.description }}</p>
      <div class="hero__actions">
        <a class="button button--primary" href="#blog">阅读文章</a>
        <a class="button button--ghost" href="{{ site.social.github }}">GitHub</a>
      </div>
    </div>

    <aside class="profile-card" aria-label="作者信息">
      <img class="profile-card__avatar" src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="{{ site.title }} avatar">
      <div>
        <p class="profile-card__label">Created by</p>
        <p class="profile-card__name">{{ site.author | default: site.title }}</p>
      </div>
    </aside>
  </section>
</header>
