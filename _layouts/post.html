---
layout: default
---

<article class="post-container post-container--single" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}#blog">返回博客</a>
    <div class="post-meta">
      <time datetime="{{ page.date | date: date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y.%m.%d" }}</time>
      {% if page.tags.size > 0 %}
        <span>{{ page.tags | join:' · ' }}</span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <section class="post" itemprop="articleBody">
    {{ content }}
  </section>
</article>
